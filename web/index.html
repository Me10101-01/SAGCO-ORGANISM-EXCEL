<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGCO-C1602 Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SAGCO-C1602-O-1B</h1>
            <p class="status" id="status-badge">Loading...</p>
        </header>
        
        <main id="dashboard">
            <section class="metrics-grid">
                <div class="card">
                    <h3>ISO Completion</h3>
                    <div class="metric" id="iso-metric">--</div>
                </div>
                
                <div class="card">
                    <h3>RBIC Clouds</h3>
                    <div class="metric" id="rbic-metric">--</div>
                </div>
                
                <div class="card">
                    <h3>ERU Verified</h3>
                    <div class="metric" id="eru-metric">--</div>
                </div>
                
                <div class="card">
                    <h3>Hours Remaining</h3>
                    <div class="metric" id="hours-metric">--</div>
                </div>
                
                <div class="card">
                    <h3>Risk Level</h3>
                    <div class="metric risk" id="risk-metric">--</div>
                </div>
                
                <div class="card">
                    <h3>Next Brick</h3>
                    <div class="metric next" id="next-metric">--</div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="js/dashboard.js"></script>
</body>
</html>
